name: Aktualizace zápasů Vlašimi

on:
  schedule:
    - cron: "37 4 * * *"   # denně kolem 5:37 / 6:37 českého času
  workflow_dispatch:        # ruční spuštění z karty Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout zápasy ze zapasy.ceskyhokej.cz
        run: python scripts/update_games.py
      - name: Uložit změny
        run: |
          if git diff --quiet -- games.json; then
            echo "Žádná změna."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Aktualizace zápasů ($(date -u +%Y-%m-%d))"
          git push
